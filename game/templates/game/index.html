<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genius</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'game/css/index.css' %}" />
  </head>
  <body>
    <main class="container">
      <h1>Projeto Genius</h1>

      <section class="stage-section">
        <div id="stage-timer" class="stage-timer hidden">0.00s</div>
        <div id="stage-screen" class="stage-screen black">
          <div class="stage-content">
            <div id="stage-text" class="stage-text">Clique qualquer cor para iniciar</div>
            <div class="stage-hints" aria-label="Controles do teclado">
              <span><kbd>1</kbd> Azul</span>
              <span><kbd>2</kbd> Verde</span>
              <span><kbd>3</kbd> Vermelho</span>
              <span><kbd>4</kbd> Amarelo</span>
            </div>
          </div>
        </div>
      </section>

      <section class="status-section">
        <article class="status-row">
          <span>Pontuacao</span>
          <strong id="score">0</strong>
        </article>
        <article class="status-row">
          <span>Rodada</span>
          <strong id="round">0</strong>
        </article>
        <article class="status-row">
          <span>Tempo</span>
          <strong id="timer">-</strong>
        </article>
      </section>

      <section class="attempts-section">
        <div class="attempts-header">
          <h2>Tentativas</h2>
          <p id="message">Carregando...</p>
        </div>

        <div class="summary-grid">
          <article class="summary-row"><span>Maior pontuacao</span><strong id="best-score">0</strong></article>
          <article class="summary-row"><span>Ultima pontuacao</span><strong id="last-score">0</strong></article>
          <article class="summary-row"><span>Total tentativas</span><strong id="attempts">0</strong></article>
        </div>

        <div id="attempts-list" class="attempts-list"></div>
      </section>
    </main>
    <script>
      window.GENIUS_RUNTIME_MODE = "{{ runtime_mode|escapejs }}";
    </script>
    <script src="{% static 'game/js/index.js' %}"></script>
  </body>
</html>
